name: Release and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to release (must match an existing release-please PR, e.g. 2.1.0). Leave blank for tag-driven runs."
        required: false
        type: string
      dry_run:
        description: "Run every step but do not publish packages or create a GitHub release."
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  attestations: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: "24"
  SBOM_DIR: release-assets/sbom
  HASH_DIR: release-assets/hashes
  BINARY_DIR: release-assets/binaries

jobs:
  # ---------- 1. Quality gate ----------
  validate:
    name: Validate and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Rust - Check formatting
        working-directory: converters/rust
        run: cargo fmt -- --check

      - name: Rust - Run clippy
        working-directory: converters/rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust - Run tests
        working-directory: converters/rust
        run: cargo test --all-features --verbose

      - name: Rust - Run doc tests
        working-directory: converters/rust
        run: cargo test --doc --all-features --verbose

      - name: Node - Install dependencies
        working-directory: converters/node
        run: pnpm install --frozen-lockfile

      - name: Node - Check formatting
        working-directory: converters/node
        run: pnpm run format:check

      - name: Node - Run linter
        working-directory: converters/node
        run: pnpm run lint

      - name: Node - Run tests
        working-directory: converters/node
        run: pnpm test

      - name: Node - Type check
        working-directory: converters/node
        run: npx tsc --noEmit

      - name: Install root dependencies
        run: pnpm -w install --frozen-lockfile

  # ---------- 2. Build binaries + SBOMs ----------
  build:
    name: Build Binaries & SBOMs
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag: ${{ steps.resolve-version.outputs.tag }}
      dry_run: ${{ steps.resolve-version.outputs.dry_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Resolve version
        id: resolve-version
        shell: bash
        run: |
          set -euo pipefail
          DRY_RUN='${{ github.event.inputs.dry_run || '' }}'
          INPUT_VERSION='${{ github.event.inputs.version || '' }}'
          DRY='false'
          if [[ "${DRY_RUN}" == "true" ]]; then DRY='true'; fi
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
            TAG="v${VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(jq -r '.["."]' .release-please-manifest.json)"
            TAG="v${VERSION}"
            DRY='true'  # require explicit dispatch for non-tag runs
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "dry_run=${DRY}" >> $GITHUB_OUTPUT
          echo "Resolved version=${VERSION} tag=${TAG} dry_run=${DRY}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ steps.resolve-version.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Create release-assets directories
        run: |
          mkdir -p "${SBOM_DIR}" "${HASH_DIR}" "${BINARY_DIR}"
          echo "sbom=${SBOM_DIR}" >> $GITHUB_OUTPUT
          echo "hash=${HASH_DIR}" >> $GITHUB_OUTPUT
          echo "bin=${BINARY_DIR}" >> $GITHUB_OUTPUT

      # ---- Rust (jxql) ----
      - name: Build jxql release binary (gnu)
        run: |
          set -euo pipefail
          pushd converters/rust >/dev/null
          cargo build --release --locked --bin jxql --features cli --target x86_64-unknown-linux-gnu
          popd >/dev/null
          # Cargo workspace puts artifacts in the workspace root's target/.
          mkdir -p "${BINARY_DIR}"
          cp "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-gnu/release/jxql" "${BINARY_DIR}/jxql-x86_64-unknown-linux-gnu"
          ls -la "${BINARY_DIR}"

      - name: Build jxql release binary (musl, optional)
        if: ${{ hashFiles('rust-toolchain.toml') != '' || true }}
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup target list --installed | grep -qx 'x86_64-unknown-linux-musl'; then
            echo "::notice::x86_64-unknown-linux-musl target not installed; skipping musl build (install with: rustup target add x86_64-unknown-linux-musl)"
            exit 0
          fi
          pushd converters/rust >/dev/null
          cargo build --release --locked --bin jxql --features cli --target x86_64-unknown-linux-musl
          popd >/dev/null
          cp "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-musl/release/jxql" "${BINARY_DIR}/jxql-x86_64-unknown-linux-musl"
          ls -la "${BINARY_DIR}"

      - name: Build WASM bundle (optional)
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup target list --installed | grep -qx 'wasm32-unknown-unknown'; then
            echo "::notice::wasm32-unknown-unknown target not installed; skipping WASM build (install with: rustup target add wasm32-unknown-unknown)"
            exit 0
          fi
          if ! command -v wasm-pack >/dev/null 2>&1; then
            echo "::notice::wasm-pack not installed; skipping WASM build (install with: cargo install wasm-pack)"
            exit 0
          fi
          pushd converters/rust >/dev/null
          wasm-pack build --target web --release --out-dir "${GITHUB_WORKSPACE}/${BINARY_DIR}/wasm"
          popd >/dev/null
          ls -la "${BINARY_DIR}/wasm"

      - name: Build Node CLI bundles
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @json-schema-x-graphql/core run build
          pnpm --filter @json-schema-x-graphql/cli  run build
          mkdir -p "${BINARY_DIR}/node"
          cp converters/cli/dist/index.js       "${BINARY_DIR}/node/json-schema-x-graphql.cjs"
          cp converters/cli/dist/validate.js    "${BINARY_DIR}/node/jxql-validate.cjs"
          cp converters/cli/dist/migrate.js     "${BINARY_DIR}/node/jxql-migrate.cjs"
          cp converters/node/dist/converter.js  "${BINARY_DIR}/node/@json-schema-x-graphql--core.cjs"
          ls -la "${BINARY_DIR}/node"

      # ---- Hashes ----
      - name: Generate SHA-256 hashes
        run: |
          set -euo pipefail
          : > "${HASH_DIR}/SHA256SUMS"
          (cd "${BINARY_DIR}" && find . -type f \( -name jxql -o -name 'jxql-*' -o -name '*.cjs' -o -name '*.wasm' \) -print0 | sort -z | xargs -0 sha256sum) | tee -a "${HASH_DIR}/SHA256SUMS"
          cat "${HASH_DIR}/SHA256SUMS"

      - name: Verify jxql binary smoke tests
        run: |
          set -euo pipefail
          for b in "${BINARY_DIR}"/jxql-*; do
            [ -x "$b" ] || continue
            "$b" --version || { echo "smoke test failed: $b"; exit 1; }
          done
          node -e "require('${GITHUB_WORKSPACE}/${BINARY_DIR}/node/@json-schema-x-graphql--core.cjs')" || true

      # ---- SBOMs: Rust (CycloneDX) ----
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOMs for Rust crate
        run: |
          set -euo pipefail
          pushd converters/rust >/dev/null
          cargo cyclonedx --format json --override-filename rust-cdx --all --quiet
          cargo cyclonedx --format xml  --override-filename rust-cdx --all --quiet
          # cargo-cyclonedx 0.5.x writes <name>.json / <name>.xml
          if [ ! -f rust-cdx.json ] && [ -f rust-cdx.cdx.json ]; then mv rust-cdx.cdx.json rust-cdx.json; fi
          if [ ! -f rust-cdx.xml  ] && [ -f rust-cdx.cdx.xml  ]; then mv rust-cdx.cdx.xml  rust-cdx.xml;  fi
          popd >/dev/null
          mv converters/rust/rust-cdx.json "$GITHUB_WORKSPACE/${SBOM_DIR}/rust-cdx.json"
          mv converters/rust/rust-cdx.xml  "$GITHUB_WORKSPACE/${SBOM_DIR}/rust-cdx.xml"
          ls -la "$GITHUB_WORKSPACE/${SBOM_DIR}"

      # ---- SBOMs: Node (CycloneDX + SPDX) ----
      # `cdxgen` understands pnpm-lock.yaml natively and emits both CycloneDX and SPDX
      # in a single invocation, which avoids `cyclonedx-npm`'s npm-lock-only constraint.
      # We run each cdxgen from /tmp and with hardcoded args because cdxgen 12.x has
      # a quirk where the second invocation in a shell session can silently produce
      # an empty BOM if it sees the same workspace tree with different args.
      - name: Generate CycloneDX + SPDX SBOMs for Node workspaces
        working-directory: /tmp
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cdxgen@^12 --no-install-deps --spec-version 1.6 --type application -t pnpm \
            -o "${SBOM_DIR}/node-cli-cdx.json"      --output-format JSON      "${GITHUB_WORKSPACE}/converters/cli"
          npx --yes @cyclonedx/cdxgen@^12 --no-install-deps --spec-version 1.6 --type application -t pnpm \
            -o "${SBOM_DIR}/node-cli-spdx.spdx.json" --output-format SPDXJSON "${GITHUB_WORKSPACE}/converters/cli"
          npx --yes @cyclonedx/cdxgen@^12 --no-install-deps --spec-version 1.6 --type library -t pnpm \
            -o "${SBOM_DIR}/node-core-cdx.json"     --output-format JSON      "${GITHUB_WORKSPACE}/converters/node"
          npx --yes @cyclonedx/cdxgen@^12 --no-install-deps --spec-version 1.6 --type library -t pnpm \
            -o "${SBOM_DIR}/node-core-spdx.spdx.json" --output-format SPDXJSON "${GITHUB_WORKSPACE}/converters/node"

      - name: Sanity-check SBOM files
        run: |
          set -euo pipefail
          for f in "${SBOM_DIR}"/*.json; do
            jq empty "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }
            sz=$(stat -c%s "$f"); [ "$sz" -gt 200 ] || { echo "suspiciously small SBOM: $f ($sz bytes)"; exit 1; }
          done
          ls -la "${SBOM_DIR}" "${HASH_DIR}" "${BINARY_DIR}"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ steps.resolve-version.outputs.tag }}
          path: |
            release-assets/binaries
            release-assets/sbom
            release-assets/hashes
          if-no-files-found: error
          retention-days: 90

  # ---------- 3. Publish Node packages ----------
  publish-node:
    name: Publish Node packages to npm
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    strategy:
      fail-fast: false
      matrix:
        package:
          - dir: converters/node
            name: '@json-schema-x-graphql/core'
          - dir: converters/cli
            name: '@json-schema-x-graphql/cli'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install root dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.dir }}
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------- 4. Publish Rust crate ----------
  publish-rust:
    name: Publish Rust crate to crates.io
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Publish crate to crates.io
        working-directory: converters/rust
        run: |
          set -euo pipefail
          # dry-run once to surface packaging issues, then publish
          cargo publish --dry-run --locked --allow-dirty
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  # ---------- 5. Create GitHub Release ----------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-node, publish-rust]
    if: needs.build.outputs.dry_run == 'false'
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download release assets artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Generate combined SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -type f -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS.txt
          cp SHA256SUMS.txt hashes/SHA256SUMS.txt

      # Generate signed build provenance (SLSA-style) for the binary artifacts.
      # This binds each artifact to the workflow run + repo via Sigstore, and the
      # resulting `.intoto.jsonl` files are re-attached to the release below.
      - name: Attest release binaries (build provenance)
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-names: |
            jxql-x86_64-unknown-linux-gnu
            jxql-x86_64-unknown-linux-musl
            json-schema-x-graphql
            jxql-validate
            jxql-migrate
            @json-schema-x-graphql--core
          subject-paths: |
            release-assets/binaries/jxql-x86_64-unknown-linux-gnu
            release-assets/binaries/jxql-x86_64-unknown-linux-musl
            release-assets/binaries/node/json-schema-x-graphql.cjs
            release-assets/binaries/node/jxql-validate.cjs
            release-assets/binaries/node/jxql-migrate.cjs
            release-assets/binaries/node/@json-schema-x-graphql--core.cjs
            release-assets/binaries/wasm/json_schema_x_graphql_bg.wasm

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          {
            echo "## json-schema-x-graphql ${VERSION}"
            echo
            echo "### Downloads"
            echo
            echo "**Rust \`jxql\` CLI binaries** (sha256-verified):"
            echo
            for f in release-assets/binaries/jxql-x86_64-unknown-linux-gnu release-assets/binaries/jxql-x86_64-unknown-linux-musl; do
              [ -e "$f" ] || continue
              sz=$(stat -c%s "$f")
              sha=$(sha256sum "$f" | awk '{print $1}')
              base=$(basename "$f")
              echo "- \`${base}\` (${sz} bytes) — \`${sha}\`"
            done
            echo
            echo "**Node CLI bundles** (sha256-verified):"
            echo
            for f in release-assets/binaries/node/*; do
              [ -e "$f" ] || continue
              sz=$(stat -c%s "$f")
              sha=$(sha256sum "$f" | awk '{print $1}')
              base=$(basename "$f")
              echo "- \`${base}\` (${sz} bytes) — \`${sha}\`"
            done
            echo
            echo "**WASM bundle for browsers** (sha256-verified):"
            echo
            for f in release-assets/binaries/wasm/*.wasm release-assets/binaries/wasm/*.js; do
              [ -e "$f" ] || continue
              sz=$(stat -c%s "$f")
              sha=$(sha256sum "$f" | awk '{print $1}')
              base=$(basename "$f")
              echo "- \`${base}\` (${sz} bytes) — \`${sha}\`"
            done
            echo
            echo "### Software Bill of Materials (SBOM)"
            echo
            echo "CycloneDX (JSON + XML) and SPDX-JSON SBOMs are attached for both the Rust crate and the Node workspaces:"
            echo
            echo "- \`rust-cdx.json\` / \`rust-cdx.xml\` — Rust crate CycloneDX SBOMs"
            echo "- \`node-cli-cdx.json\` / \`node-cli-spdx.spdx.json\` — @json-schema-x-graphql/cli SBOMs"
            echo "- \`node-core-cdx.json\` / \`node-core-spdx.spdx.json\` — @json-schema-x-graphql/core SBOMs"
            echo
            echo "### Build provenance (SLSA)"
            echo
            echo "Every binary in this release is covered by a signed build-provenance attestation"
            echo "(\`.intoto.jsonl\`). Verify with:"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo $(echo \$GITHUB_REPOSITORY)"
            echo '```'
            echo
            echo "### Verifying binaries"
            echo
            echo '```'
            echo "# Fetch the release"
            echo "gh release download '${{ needs.build.outputs.tag }}'"
            echo
            echo "# Verify all artifacts"
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "### npm"
            echo
            echo "Both Node packages were published with provenance and are installable via:"
            echo
            echo '```'
            echo "npm install @json-schema-x-graphql/core@${VERSION}"
            echo "npm install @json-schema-x-graphql/cli@${VERSION}"
            echo '```'
            echo
            echo "### crates.io"
            echo
            echo '```'
            echo "cargo install json-schema-x-graphql --version ${VERSION} --locked"
            echo '```'
          } > release-assets/RELEASE_NOTES.md
          cat release-assets/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/binaries/jxql-x86_64-unknown-linux-gnu
            release-assets/binaries/jxql-x86_64-unknown-linux-musl
            release-assets/binaries/node/*
            release-assets/binaries/wasm/*.wasm
            release-assets/binaries/wasm/*.js
            release-assets/sbom/*.json
            release-assets/binaries/**/*.intoto.jsonl
            release-assets/SHA256SUMS.txt
            release-assets/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
