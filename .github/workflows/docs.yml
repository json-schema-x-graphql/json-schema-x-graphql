name: Build Docs Site

on:
  push:
    branches: [main, develop]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nextra Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @json-schema-x-graphql/website build
        env:
          BASE_PATH: "/json-schema-x-graphql"

      - name: Type check
        run: pnpm --filter @json-schema-x-graphql/website typecheck
