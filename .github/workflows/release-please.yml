name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    # The organization policy for this repo disables the ability of the
    # default GITHUB_TOKEN to create or approve pull requests, which makes
    # release-please fail at the "open the release PR" step. We mint a
    # short-lived token from the json-schema-x-graphql-release GitHub App
    # (contents: write, pull-requests: write) on every run instead of storing
    # a long-lived PAT. Falls back to skip-github-pull-request if the app
    # credentials aren't configured, so version/changelog computation still
    # succeeds without failing the job.
    env:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
    steps:
      - name: Mint release-please App token
        id: app-token
        if: ${{ env.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # app-id (not client-id) matches the numeric "App ID" value stored in the secret.
          app-id: ${{ env.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please (opens/updates the release PR)
        if: ${{ steps.app-token.outputs.token != '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Run release-please (no app token configured; org policy blocks GITHUB_TOKEN PR creation)
        if: ${{ steps.app-token.outputs.token == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

