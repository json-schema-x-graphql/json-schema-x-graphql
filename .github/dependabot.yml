version: 2
updates:
  # Root pnpm workspace (automatically manages all workspace packages listed in pnpm-workspace.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      workspace-npm-dependencies:
        patterns:
          - "*"
    ignore:
      # plugin-react 6.x requires Vite 7, but subgraph-composer builds on Vite 6
      # (root override `vite: ^6.4.3`): 6.2.1 fails `vite build` with
      # ERR_PACKAGE_PATH_NOT_EXPORTED for `vite/internal` (seen in #356).
      # Remove this rule once the Vite 7 migration lands.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # Standalone Frontend dashboard (not in workspace)
  - package-ecosystem: "npm"
    directory: "/frontend/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dashboard-npm-dependencies:
        patterns:
          - "*"

  # Independent Visual JSON workspace submodule
  - package-ecosystem: "npm"
    directory: "/external/visual-json"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      visual-json-npm-dependencies:
        patterns:
          - "*"

  # Rust Cargo ecosystem. The workspace root is the repository root (virtual
  # manifest with member converters/rust) and Cargo.lock lives there, so
  # Dependabot must run from "/" to keep the lockfile in sync with
  # converters/rust/Cargo.toml (see #350, which merged a Cargo.toml bump
  # without a Cargo.lock update).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

