# Security override floors, kept in sync with the root pnpm-workspace.yaml.
# `braces` has no published fix yet (GHSA-vfj7-8cjw-p6xm lists >=3.0.4 as
# patched but npm's latest is 3.0.3).
allowBuilds:
  '@apollo/protobufjs': true
  '@apollo/rover': true
  protobufjs: true
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
overrides:
  "@babel/core": ^7.29.6
  "@fastify/busboy": ^3.2.2
  "@fastify/busboy@<3.2.2": ^3.2.2
  "@grpc/grpc-js": ^1.14.5
  "@grpc/grpc-js@<1.14.5": 1.14.5
  "@isaacs/brace-expansion": ^5.0.12
  "@opentelemetry/core": ^2.8.0
  "@opentelemetry/core@<2.8.0": ^2.8.0
  "@protobufjs/utf8": ^1.1.1
  axios: ^1.20.0
  baseline-browser-mapping: ^2.11.0
  brace-expansion: ^5.0.12
  brace-expansion@<5.0.12: 5.0.12
  browserslist: ^4.28.7
  fast-uri: ^3.1.8
  fast-uri@<3.1.8: ^3.1.8
  fast-xml-builder: ^1.1.7
  fast-xml-parser: ^5.5.6
  http-cache-semantics: ^4.3.0
  http-cache-semantics@<4.3.0: 4.3.0
  immutable: ^5.1.8
  js-yaml: ^4.3.2
  js-yaml@<4.3.2: ^4.3.2
  lodash: ^4.18.1
  minimatch: ^10.2.5
  picomatch: ^4.0.4
  protobufjs: ^7.6.3
  tmp: ^0.2.7
  tmp@<0.2.7: 0.2.7
  ws: 8.21.1
  ws@<8.21.1: 8.21.1
