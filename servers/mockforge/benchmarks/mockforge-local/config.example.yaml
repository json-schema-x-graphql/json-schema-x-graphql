# Custom server config (informational; the harness invokes node mock-server.js
# directly and the actual config lives in ../mockforge.config.js).
#
# Reference only. The startup command is in ./up.sh.

server:
  port: 4101
  system: fpds
  subgraphPath: "../../../generated-schemas/fpds.subgraph.graphql"

scalars:
  PIID:     "GS-XXXX-XXXXXXXX"
  UEI:      "12-char alphanumeric uppercase"
  AgencyCode: "4-digit federal agency code"
  NAICSCode: "6-digit NAICS"
  PSCCode:  "4-character alphanumeric"
  FiscalYear: "4-digit year, 2018-2026"
  DateTime: "ISO 8601 UTC"
  Decimal: "Float with 2 decimals"
  PositiveDecimal: "Float > 0 with 2 decimals"
  Percentage: "Float 0-100 with 2 decimals"
  Email: "faker.internet.email"
  PhoneNumber: "faker.phone.number"
  URI: "faker.internet.url"