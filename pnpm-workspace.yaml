packages:
  - converters/node
  - converters/cli
  - frontend/subgraph-composer
  - website
  - examples/mesh-gateway
  - external/visual-json
  - external/visual-json/packages/*
  - external/visual-json/packages/@visual-json/*
  - external/visual-json/packages/@internal/*

allowBuilds:
  "@apollo/protobufjs": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  wasm-pack: false

onlyBuiltDependencies:
  - "visual-json"
  - "sharp"
  - "@apollo/protobufjs"
  - "protobufjs"
  - "esbuild"

