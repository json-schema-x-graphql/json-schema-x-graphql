# Security override floors, kept in sync with the root pnpm-workspace.yaml.
# `next` is intentionally NOT overridden: this workspace pins next@16.3.6,
# which is newer than the root floor. `braces` is patched in-tree because
# no upstream fix has been published (GHSA-vfj7-8cjw-p6xm lists >=3.0.4
# but npm's latest is 3.0.3).
overrides:
  "@fastify/busboy": ^3.2.2
  "@fastify/busboy@<3.2.2": ^3.2.2
  baseline-browser-mapping: ^2.11.0
  brace-expansion: ^5.0.12
  brace-expansion@<5.0.12: 5.0.12
  browserslist: ^4.28.7
  dompurify: 3.4.16
  dompurify@<3.4.16: 3.4.16
  fast-uri: ^3.1.8
  fast-uri@<3.1.8: ^3.1.8
  immutable: ^5.1.8
  js-yaml@<3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  minimatch@<4.2.5: 4.2.5
  ts-deepmerge: ^8.0.0
  ts-deepmerge@<8.0.0: ^8.0.0
  uuid: 11.1.1
  uuid@<11.1.1: 11.1.1
  ws: 8.21.1
  ws@<8.21.1: 8.21.1
  source-map-js: ^1.2.2
  source-map-js@<1.2.2: ^1.2.2
  "@graphql-tools/executor-legacy-ws": ^1.1.35
  "@graphql-tools/executor-legacy-ws@<1.1.35": ^1.1.35
